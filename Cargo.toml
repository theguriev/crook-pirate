[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Eugen Guriev <gurievcreative@gmail.com>"]
edition = "2024"
version = "0.3.0"
license = "MIT"
repository = "https://github.com/theguriev/crook-pirate"
publish = false

[workspace.dependencies]
# The published vocabulary rather than a copy of it. `0.8` is Cargo's way of
# writing "plugin ABI 8": the crate is versioned `0.<abi>.<patch>`, and a host
# loads one ABI and refuses every other by name.
crook_plugin_api = "0.8"

postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"

# The whole point of a store plugin is that it is small: a person downloads it,
# and a megabyte of formatting code is a megabyte nobody asked for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
